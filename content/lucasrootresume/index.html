<!DOCTYPE html>
<html lang="en">

<!--
    Legacy redirect. /content/lucasrootresume (no .pdf) was shared externally
    before /resume existed, and 404'd because GitHub Pages won't serve a file
    without its extension. This directory catches that path.

    Points at /resume rather than the PDF directly, so the filename still
    lives in exactly one file (../../resume/index.html). Do not delete —
    links to this path are already out in the world.
-->

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lucas Root — résumé</title>
    <meta http-equiv="refresh" content="0; url=/resume">
    <link rel="canonical" href="https://lucasroot.org/resume">
    <link rel="icon" href="/content/LR_Logo.svg" type="image/x-icon">
    <style>
        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: Inter, system-ui, -apple-system, sans-serif;
            font-size: 15px;
            background: #fff;
            color: #111;
        }

        @media (prefers-color-scheme: dark) {
            body { background: #111; color: #eee; }
        }

        a { color: inherit; }
    </style>
</head>

<body>
    <p>Redirecting to <a id="to" href="/resume">my résumé</a>&hellip;</p>
    <script>location.replace(document.getElementById("to").href);</script>
</body>

</html>
