<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="../content/LR_Logo.svg" type="image/x-icon">
    <title></title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <link rel="stylesheet" href="snake.css">
</head>
<body>
    <div class="wrapper">
        <div class="main-layout">

            <!--Score Board-->
            <div class="score-board">
                <div class="score-item">
                    <i class="fa-solid fa-apple-whole"></i>
                    <span id="score">0</span>
                </div>
                <div class="score-item">
                    <i class="fa-solid fa-trophy"></i>
                    <span id="high-score">0</span>
                </div>
            </div>

            <!--Leaderboard-->
            <div class="leaderboard-container">
                <h3>Leaderboard</h3>
                <ul id="leaderboard-list">
                    <li>Loading...</li>
                </ul>
            </div>

            <!--Game Board-->
            <div class="game-container">
                <canvas id="game-board" width="400" height="400"></canvas>
                
                <!-- Start/Restart Overlay -->
                <div class="controls" id="controls-overlay">
                    <button id="start-btn" class="btn">Start</button>
                </div>
                <!--Pause-->
                <div id="pause-overlay" style="display: none;">PAUSED</div>

                <!-- Highscore Input Form -->
                <div class="highscore-form" id="highscore-form" style="display: none;">
                    <h2>New High Score!</h2>
                    <input type="text" id="username-input" maxlength="8" placeholder="your name" style="text-transform: uppercase;">
                    <div class="form-buttons">
                        <button id="cancel-btn" class="btn btn-secondary">Cancel</button>
                        <button id="submit-score-btn" class="btn">Submit</button>
                        
                    </div>
                    
                </div>
            </div>
        </div>
    </div>
    <script type="module" src="snake.js"></script>
</body>
</html>
